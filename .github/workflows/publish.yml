name: publish to npm

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["version, tag and github release"]
    types: [completed]
    branches: [release]

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || 'release' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check npm version
        id: npm-version
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")

          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "Version $package_name@$package_version already exists on npm; skipping publish."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $package_name@$package_version does not exist on npm; publishing."
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi
      - if: ${{ steps.npm-version.outputs.should_publish == 'true' }}
        run: npm install
      - if: ${{ steps.npm-version.outputs.should_publish == 'true' }}
        run: npm run build
      - if: ${{ steps.npm-version.outputs.should_publish == 'true' }}
        run: npm run prepack
      - name: Diagnose npm authentication
        if: ${{ steps.npm-version.outputs.should_publish == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "npm version: $(npm --version)"
          echo "registry: $(npm config get registry)"
          echo "user config: $(npm config get userconfig)"

          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is empty or unavailable to this workflow."
            exit 1
          fi

          echo "NPM_TOKEN secret is available."
          echo "Authenticated npm user: $(npm whoami --registry=https://registry.npmjs.org/)"
          npm ping --registry=https://registry.npmjs.org/
      - name: Publish to npm
        if: ${{ steps.npm-version.outputs.should_publish == 'true' }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - if: ${{ steps.npm-version.outputs.should_publish == 'true' }}
        run: npm run postpack
